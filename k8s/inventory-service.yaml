apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: personal-workspace
  labels:
    app: inventory-service
spec:
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: personal-workspace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: shashtaazaa/inventory-service:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://inventory-postgres:5432/inventory
            - name: SPRING_DATASOURCE_USERNAME
              value: inventory
            - name: SPRING_DATASOURCE_PASSWORD
              value: inventory
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4317
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.name=inventory-service,service.namespace=observability-demo,deployment.environment=dev
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /inventory/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /inventory/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
