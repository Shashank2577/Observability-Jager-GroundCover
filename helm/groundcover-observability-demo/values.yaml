# Default values for groundcover-observability-demo
# This is a YAML-formatted file.

# Global configuration
global:
  imageRegistry: ""
  imagePullSecrets: []
  storageClass: ""

# Namespace configuration
namespace:
  name: observability-demo
  create: true

# Orders service configuration
ordersService:
  enabled: true
  image:
    repository: shashtaazaa/orders-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://orders-postgres:5432/orders"
    SPRING_DATASOURCE_USERNAME: "orders"
    SPRING_DATASOURCE_PASSWORD: "orders"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    OTEL_RESOURCE_ATTRIBUTES: "service.name=orders-service,service.namespace=observability-demo,deployment.environment=dev"
    INVENTORY_BASE_URL: "http://inventory-service:8080"

# Inventory service configuration
inventoryService:
  enabled: true
  image:
    repository: shashtaazaa/inventory-service
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  env:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://inventory-postgres:5432/inventory"
    SPRING_DATASOURCE_USERNAME: "inventory"
    SPRING_DATASOURCE_PASSWORD: "inventory"
    OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    OTEL_RESOURCE_ATTRIBUTES: "service.name=inventory-service,service.namespace=observability-demo,deployment.environment=dev"

# PostgreSQL configuration
postgres:
  orders:
    enabled: true
    image:
      repository: postgres
      tag: "15"
      pullPolicy: IfNotPresent
    env:
      POSTGRES_USER: "orders"
      POSTGRES_PASSWORD: "orders"
      POSTGRES_DB: "orders"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: false
      storageClass: ""
      size: 1Gi
  
  inventory:
    enabled: true
    image:
      repository: postgres
      tag: "15"
      pullPolicy: IfNotPresent
    env:
      POSTGRES_USER: "inventory"
      POSTGRES_PASSWORD: "inventory"
      POSTGRES_DB: "inventory"
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    persistence:
      enabled: false
      storageClass: ""
      size: 1Gi

# OpenTelemetry Collector configuration
otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: "0.95.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    ports:
      grpc: 4317
      http: 4318
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Jaeger configuration
jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.50"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    ports:
      ui: 16686
      grpc: 14250
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Load generator configuration
loadGenerator:
  enabled: true
  image:
    repository: curlimages/curl
    tag: "8.8.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Ingress configuration
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: observability-demo.local
      paths:
        - path: /orders
          pathType: Prefix
          service:
            name: orders-service
            port: 8080
        - path: /inventory
          pathType: Prefix
          service:
            name: inventory-service
            port: 8080
        - path: /jaeger
          pathType: Prefix
          service:
            name: jaeger
            port: 16686
  tls: []