{{- if and .Values.collector.enabled (ne .Values.global.otlp.mode "direct") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: {{ .Values.global.namespace }}
  labels:
    app: otel-collector
    component: otel
data:
  otel-collector-config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # File log receiver for application logs
      filelog:
        include: [ "/var/log/app/*.log" ]
        start_at: beginning
        operators:
          - type: json_parser
            parse_from: body
          - type: move
            from: attributes.trace_id
            to: trace_id
          - type: move
            from: attributes.span_id
            to: span_id
      # Syslog receiver for container logs
      syslog:
        listen_address: "0.0.0.0:514"
        protocol: tcp

    exporters:
      logging:
        loglevel: debug
      otlp/groundcover-grpc:
        endpoint: http://10.1.1.202:31519
        tls:
          insecure: true
      otlp/groundcover-http:
        endpoint: http://10.1.1.202:30907
        tls:
          insecure: true
      # Log exporters to GroundCover
      otlp/groundcover-logs-grpc:
        endpoint: http://10.1.1.202:31519
        tls:
          insecure: true
      otlp/groundcover-logs-http:
        endpoint: http://10.1.1.202:30907
        tls:
          insecure: true

    processors:
      batch:
        timeout: 1s
        send_batch_size: 1024
      resource:
        attributes:
          - key: deployment.environment
            value: groundcover-demo
            action: upsert
          - key: service.namespace
            value: shash.demo
            action: upsert
          - key: service.version
            value: "1.0.0"
            action: upsert

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [resource, batch]
          exporters: [logging, otlp/groundcover-grpc, otlp/groundcover-http]
        logs:
          receivers: [otlp, filelog, syslog]
          processors: [resource, batch]
          exporters: [logging, otlp/groundcover-logs-grpc, otlp/groundcover-logs-http]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: {{ .Values.global.namespace }}
  labels:
    app: otel-collector
spec:
  type: ClusterIP
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: {{ .Values.global.namespace }}
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          image: {{ .Values.collector.image }}
          args: ["--config=/conf/otel-collector-config.yaml"]
          ports:
            - containerPort: 4317
            - containerPort: 4318
          volumeMounts:
            - name: config
              mountPath: /conf
          resources:
{{- toYaml .Values.collector.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
            items:
              - key: otel-collector-config.yaml
                path: otel-collector-config.yaml
{{- end }}
